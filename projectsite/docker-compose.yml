services:
  web:
    build: .
    image: psusphere:latest
    container_name: psusphere-container
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - USE_SQLITE=true
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1] 0.0.0.0 cojjee123.pythonanywhere.com localhost micahana.pythonanywhere.com